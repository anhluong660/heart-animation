<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart Fly</title>
  <style>
    @font-face {
      font-family: "BerkshireSwash";
      src: url("fonts/BerkshireSwash-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-1: #190b2e;
      --bg-2: #3b103d;
      --bg-3: #7a1747;
      --pink: #ff5fa2;
      --rose: #ff86bc;
      --hot: #ff2d6f;
      --text: #fff3f8;
      --shadow: rgba(255, 77, 133, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "BerkshireSwash", cursive;
      background-attachment: fixed;
      background-color: #1c1020;
      background:
        linear-gradient(180deg, rgba(12, 6, 18, 0.24), rgba(12, 6, 18, 0.58)),
        linear-gradient(135deg, rgba(52, 20, 38, 0.24), rgba(28, 16, 32, 0.35)),
        url("assets/back-ground.jpg") center center / cover no-repeat fixed,
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.08), transparent 22%),
        radial-gradient(circle at 80% 30%, rgba(255, 135, 188, 0.12), transparent 26%),
        radial-gradient(circle at 50% 80%, rgba(255, 45, 111, 0.1), transparent 25%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2) 52%, var(--bg-3));
      color: var(--text);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.08), transparent 34%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.03), rgba(0, 0, 0, 0.18));
      pointer-events: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px),
        radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-position: 0 0, 24px 24px;
      background-size: 48px 48px;
      opacity: 0.2;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      isolation: isolate;
      contain: layout paint;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 46%, rgba(255, 255, 255, 0.03), transparent 34%),
        linear-gradient(180deg, rgba(7, 5, 12, 0.06), rgba(7, 5, 12, 0.16));
      pointer-events: none;
      z-index: 0;
    }

    .title {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(92vw, 900px);
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      padding: clamp(1.4rem, 3vw, 2.2rem) clamp(1rem, 2.2vw, 2rem) clamp(0.7rem, 1.6vw, 1rem);
      border-radius: 999px;
      background:
        radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0) 40%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.06)),
        rgba(255, 110, 167, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px);
      box-shadow:
        0 0 18px rgba(255, 255, 255, 0.1),
        0 0 34px rgba(255, 77, 133, 0.18),
        inset 0 0 18px rgba(255, 255, 255, 0.05);
      text-align: center;
      z-index: 2;
      user-select: none;
      pointer-events: none;
    }

    .flame-group {
      position: absolute;
      top: 35%;
      left: 85%;
      transform: translate(calc(-50% + 7.2rem), -50%);
      z-index: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.95;
      transform-origin: center;
    }

    .flame-icon {
      position: relative;
      width: clamp(9rem, 15vw, 12rem);
      height: clamp(8.4rem, 14.5vw, 11.2rem);
      animation: flameDance 1.35s ease-in-out infinite;
      filter: drop-shadow(0 0 10px rgba(255, 180, 71, 0.45));
      display: grid;
      place-items: center;
    }

    .flame-icon svg {
      width: 130%;
      height: 100%;
      top: -30%;
      display: block;
      overflow: visible;
      position: relative;
      z-index: 1;
    }

    .flame-counter {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -28%);
      width: clamp(4.5rem, 7vw, 6rem);
      height: clamp(4rem, 7vw, 5rem);
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.098), rgba(255, 140, 92, 0.24) 58%, rgba(255, 98, 48, 0.16));
      border: 2px solid rgba(251, 111, 218, 0.55);
      box-shadow:
        0 0 12px rgba(255, 170, 92, 0.22),
        inset 0 0 10px rgba(255, 255, 255, 0.16);
      color: #fff9e8;
      font-size: clamp(2rem, 3vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-shadow: 0 0 8px rgba(255, 174, 92, 0.5), 0 0 14px rgba(255, 94, 46, 0.3);
      backdrop-filter: blur(10px);
      z-index: 2;
    }

    .flame-icon .flame-main,
    .flame-icon .flame-core,
    .flame-icon .flame-glow {
      transform-origin: 50% 85%;
      animation: flameFlicker 1.1s ease-in-out infinite;
    }

    .flame-icon .flame-main {
      fill: #ffb347;
    }

    .flame-icon .flame-core {
      fill: #ffd166;
      animation-duration: 0.95s;
      animation-delay: -0.2s;
    }

    .flame-icon .flame-glow {
      fill: rgba(255, 255, 255, 0.26);
      mix-blend-mode: screen;
      animation-duration: 1.35s;
      animation-delay: -0.35s;
    }

    .title .romance-main {
      position: relative;
      z-index: 2;
      display: block;
      font-size: clamp(2rem, 5.5vw, 5.4rem);
      letter-spacing: 0.05em;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
      font-family: "BerkshireSwash", cursive;
      background: linear-gradient(180deg, #ffffff 0%, #fff1f7 28%, #ffd3e8 54%, #ff97c6 78%, #ff5b90 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow:
        0 0 12px rgba(255, 255, 255, 0.28),
        0 0 28px rgba(255, 163, 203, 0.6),
        0 0 50px rgba(255, 91, 144, 0.45);
      animation: romanceBeat 3.2s ease-in-out infinite, romanceGlow 3.4s ease-in-out infinite;
    }

    .title .romance-main::after {
      content: "";
      position: absolute;
      inset: 12% -10% -12% -10%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0) 62%);
      filter: blur(16px);
      z-index: -1;
    }

    .romance-name {
      position: absolute;
      bottom: clamp(24px, 7vh, 82px);
      left: 50%;
      transform: translateX(-50%);
      width: min(84vw, 560px);
      padding: clamp(0.85rem, 1.7vw, 1.05rem) clamp(1rem, 2.2vw, 1.7rem);
      border-radius: 999px;
      background:
        radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 40%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.08)),
        rgba(255, 110, 167, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(14px);
      box-shadow:
        0 0 18px rgba(255, 255, 255, 0.14),
        0 0 34px rgba(255, 77, 133, 0.2),
        inset 0 0 18px rgba(255, 255, 255, 0.06);
      text-align: center;
      z-index: 2;
      pointer-events: none;
      animation: romanceFloat 3.2s ease-in-out infinite reverse, romanceGlow 3.4s ease-in-out infinite;
    }

    .romance-name .name-row {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      justify-content: center;
      flex-wrap: nowrap;
      white-space: nowrap;
    }

    .romance-name .name {
      display: block;
      font-size: clamp(2rem, 5.5vw, 5.4rem);
      font-weight: 400;
      letter-spacing: 0.1em;
      font-family: "BerkshireSwash", "Segoe UI", "Tahoma", "Arial", sans-serif;
      color: #fff9fd;
      text-shadow:
        0 0 10px rgba(255, 255, 255, 0.22),
        0 0 22px rgba(255, 160, 206, 0.55),
        0 0 38px rgba(255, 77, 133, 0.32);
      white-space: nowrap;
    }

    .mini-heart {
      width: 3.5em;
      height: 3.5em;
      flex: 0 0 auto;
      display: inline-block;
      object-fit: contain;
      filter:
        drop-shadow(0 0 4px rgba(255, 255, 255, 0.18))
        drop-shadow(0 0 10px rgba(255, 77, 133, 0.28));
      animation: miniHeartBeat 0.95s ease-in-out infinite;
    }

    .stage {
      position: relative;
      width: min(88vw, 820px);
      height: min(88vw, 820px);
      display: grid;
      place-items: center;
      z-index: 1;
      perspective: 1400px;
      contain: layout paint;
    }

    .halo {
      position: absolute;
      width: min(78vw, 720px);
      height: min(78vw, 720px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 122, 173, 0.14), rgba(255, 122, 173, 0.02) 48%, transparent 70%);
      filter: blur(8px);
      animation: breathe 3.2s ease-in-out infinite;
    }

    .heart-cluster {
      position: relative;
      width: min(50vw, 430px);
      height: min(50vw, 430px);
      transform-style: preserve-3d;
      animation: tilt3d 8s ease-in-out infinite, breathe3d 1.35s ease-in-out infinite;
      filter:
        drop-shadow(0 0 14px rgba(255, 255, 255, 0.14))
        drop-shadow(0 0 28px rgba(255, 77, 133, 0.28));
      will-change: transform, filter;
    }

    .heart-cluster.is-bursting .heart-particle {
      animation: none !important;
      transition: transform 2.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 2.1s ease;
    }

    .cluster-halo {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0) 26%),
        radial-gradient(circle at 50% 55%, rgba(255, 120, 180, 0.24), rgba(255, 82, 140, 0.09) 42%, transparent 72%);
      transform: translateZ(-145px) scale(0.88);
      filter: blur(22px);
      opacity: 0.72;
      pointer-events: none;
    }

    .cluster-shell {
      position: absolute;
      transform-style: preserve-3d;
      inset: 0;
      transform-origin: center;
      animation: shellFloat 5.8s ease-in-out infinite;
      pointer-events: none;
    }

    .cluster-shell::before {
      content: "";
      position: absolute;
      inset: 12% 18% 10% 18%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0) 34%),
        radial-gradient(circle at 50% 62%, rgba(255, 57, 111, 0.24), rgba(255, 57, 111, 0) 72%);
      transform: translateZ(-42px);
      filter: blur(2px);
      opacity: 0.78;
    }

    .heart-cluster::after {
      content: "";
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.18), transparent 32%),
        radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.14), transparent 28%),
        radial-gradient(circle at 50% 74%, rgba(255, 82, 140, 0.18), transparent 56%);
      opacity: 0.5;
      filter: blur(16px);
      pointer-events: none;
      z-index: -1;
    }

    .heart-outline {
      position: absolute;
      inset: 8%;
      border-radius: 48% 52% 46% 54% / 54% 46% 54% 46%;
      border: 2px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 0 0 1px rgba(255, 120, 180, 0.12),
        inset 0 0 16px rgba(255, 255, 255, 0.08);
      transform: scale(0.96);
      opacity: 0.72;
      pointer-events: none;
      animation: outlinePulse 1.6s ease-in-out infinite;
    }

    .heart-particle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--size);
      height: var(--size);
      margin-left: calc(var(--size) / -2);
      margin-top: calc(var(--size) / -2);
      transform-style: preserve-3d;
      transform: translate3d(var(--x), var(--y), var(--z));
      animation: particleFly var(--fly) ease-in-out infinite, particleTilt 7s ease-in-out infinite;
      animation-delay: var(--delay), var(--delay);
      pointer-events: none;
      will-change: transform, opacity;
    }

    .heart-sprite {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0.88;
      filter:
        drop-shadow(0 0 1px rgba(255, 255, 255, 0.12))
        drop-shadow(0 0 8px rgba(255, 77, 133, 0.14));
      animation: particleBeat var(--beat) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .heart-particle[data-layer="front"] {
      filter:
        drop-shadow(0 0 3px rgba(255, 255, 255, 0.16))
        drop-shadow(0 0 10px rgba(255, 77, 133, 0.2));
    }

    .heart-particle[data-layer="back"] {
      opacity: 0.58;
      filter:
        blur(0.5px)
        drop-shadow(0 0 6px rgba(255, 77, 133, 0.12));
    }

    .heart-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 28%;
      height: 28%;
      margin-left: -14%;
      margin-top: -14%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 32%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 34%),
        radial-gradient(circle at 50% 56%, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0) 68%);
      transform: translateZ(52px);
      mix-blend-mode: screen;
      filter: blur(0.8px);
      pointer-events: none;
    }

    .subtitle {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-size: clamp(0.9rem, 1.8vw, 1.05rem);
      letter-spacing: 0.12em;
      font-family: "BerkshireSwash", cursive;
      color: rgba(255, 240, 248, 0.72);
      user-select: none;
      z-index: 2;
    }

    .heart-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
      contain: layout paint;
    }

    .heart {
      position: absolute;
      width: var(--size);
      height: var(--size);
      left: var(--x);
      bottom: -10vh;
      transform: rotate(45deg) scale(0.55);
      background: var(--color);
      border-radius: 14%;
      opacity: 0;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.15)) drop-shadow(0 0 18px var(--shadow));
      animation:
        floatUp var(--dur) linear forwards,
        miniBeat 1.2s ease-in-out infinite;
      animation-delay: var(--delay), calc(var(--delay) + 0.1s);
      will-change: transform, opacity;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: inherit;
    }

    .heart::before {
      left: -50%;
    }

    .heart::after {
      top: -50%;
    }

    @keyframes spin3d {
      0% {
        transform: rotateX(20deg) rotateY(0deg) rotateZ(-6deg);
      }
      50% {
        transform: rotateX(20deg) rotateY(180deg) rotateZ(6deg);
      }
      100% {
        transform: rotateX(20deg) rotateY(360deg) rotateZ(-6deg);
      }
    }

    @keyframes breathe3d {
      0%,
      100% {
        scale: 0.985;
      }
      50% {
        scale: 1.055;
      }
    }

    @keyframes tilt3d {
      0%,
      100% {
        transform: rotateX(14deg) rotateY(-10deg) rotateZ(-2deg);
      }
      50% {
        transform: rotateX(20deg) rotateY(10deg) rotateZ(2deg);
      }
    }

    @keyframes particleTilt {
      0%,
      100% {
        rotate: 0deg;
      }
      50% {
        rotate: 3deg;
      }
    }

    @keyframes shellFloat {
      0%,
      100% {
        transform: translateY(0) rotateX(0deg);
      }
      50% {
        transform: translateY(-8px) rotateX(2deg);
      }
    }

    @keyframes particleBeat {
      0%, 100% {
        transform: rotate(35deg) scale(var(--scale));
      }
      50% {
        transform: rotate(35deg) scale(calc(var(--scale) * 1.16));
      }
      70% {
        transform: rotate(35deg) scale(calc(var(--scale) * 0.95));
      }
    }

    @keyframes particleFly {
      0%,
      100% {
        transform: translate3d(var(--x), var(--y), var(--z));
      }
      25% {
        transform: translate3d(calc(var(--x) + var(--dx)), calc(var(--y) + var(--dy)), calc(var(--z) + var(--dz))) rotateZ(2deg);
      }
      50% {
        transform: translate3d(calc(var(--x) * 0.94), calc(var(--y) * 0.94), calc(var(--z) + var(--dz) * 0.6));
      }
      75% {
        transform: translate3d(calc(var(--x) - var(--dx)), calc(var(--y) - var(--dy)), calc(var(--z) - var(--dz))) rotateZ(-2deg);
      }
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translate3d(0, 0, 0) rotate(45deg) scale(0.55);
      }
      10% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--drift), -120vh, 0) rotate(45deg) scale(0.55);
      }
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(0.96);
        opacity: 0.65;
      }
      50% {
        transform: scale(1.03);
        opacity: 1;
      }
    }

    @keyframes romanceBeat {
      0%,
      100% {
        transform: scale(1);
      }
      15% {
        transform: scale(1.08);
      }
      30% {
        transform: scale(0.98);
      }
      45% {
        transform: scale(1.12);
      }
      60% {
        transform: scale(1);
      }
    }

    @keyframes romanceGlow {
      0%,
      100% {
        filter: drop-shadow(0 0 10px rgba(255, 160, 206, 0.22));
      }
      50% {
        filter: drop-shadow(0 0 20px rgba(255, 190, 225, 0.42));
      }
    }

    @keyframes miniHeartBeat {
      0%,
      100% {
        transform: scale(1) rotate(0deg);
      }
      25% {
        transform: scale(1.18) rotate(-7deg);
      }
      50% {
        transform: scale(0.96) rotate(5deg);
      }
      75% {
        transform: scale(1.14) rotate(-4deg);
      }
    }

    @keyframes flameDance {
      0%,
      100% {
        transform: translateX(-50%) rotate(-4deg) scale(1);
      }
      25% {
        transform: translateX(-50%) rotate(2deg) scale(1.05);
      }
      50% {
        transform: translateX(-50%) rotate(-2deg) scale(0.97);
      }
      75% {
        transform: translateX(-50%) rotate(4deg) scale(1.08);
      }
    }

    @keyframes flameFlicker {
      0%,
      100% {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
      25% {
        transform: scale(1.08) translateY(-1px);
      }
      50% {
        transform: scale(0.95) translateY(1px);
        opacity: 0.93;
      }
      75% {
        transform: scale(1.1) translateY(-1.5px);
      }
    }

    @media (max-width: 700px) {
      .title {
        top: 20%;
        width: min(92vw, 520px);
      }

      .title .romance-main {
        font-size: clamp(1.8rem, 11vw, 3.4rem);
        letter-spacing: 0.02em;
      }

      .romance-name {
        bottom: 26px;
        width: min(88vw, 420px);
      }

      .romance-name .name {
        font-size: clamp(1.1rem, 5.4vw, 1.8rem);
      }

      .mini-heart {
        width: 24px;
        height: 24px;
      }

      .stage {
        width: min(96vw, 560px);
        height: min(96vw, 560px);
      }

      .heart-cluster {
        width: min(76vw, 360px);
        height: min(76vw, 360px);
      }

      .halo {
        width: min(92vw, 500px);
        height: min(92vw, 500px);
      }

      html,
      body {
        background-attachment: scroll;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart-cluster,
      .halo,
      .heart {
        animation: none !important;
      }

      .heart-particle,
      .cluster-shell {
        animation: none !important;
      }

      .heart {
        opacity: 0.9;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="heart-layer" id="heartLayer" aria-hidden="true"></div>

    <div class="title">
      <div class="flame-group" aria-hidden="true">
        <div class="flame-icon">
          <svg viewBox="0 0 64 64" role="presentation">
            <path class="flame-main" d="M32 8c-3 7-10 12-10 22 0 8 6 14 10 14 4 0 10-6 10-14 0-10-7-15-10-22z" />
            <path class="flame-core" d="M32 14c-2 4-6 8-6 14 0 5 4 9 6 9 2 0 6-4 6-9 0-6-4-10-6-14z" />
            <path class="flame-glow" d="M32 12c-2 6-8 9-8 16 0 7 5 12 8 12 3 0 8-5 8-12 0-7-6-10-8-16z" />
          </svg>
          <div class="flame-counter" id="flameCounter">0</div>
        </div>
      </div>
      <strong class="romance-main">Anh Yêu Em</strong>
    </div>

    <section class="stage" aria-label="Flying hearts animation">
      <div class="halo"></div>
      <div class="heart-cluster" id="heartCluster" aria-hidden="true">
        <div class="cluster-halo"></div>
        <div class="heart-core"></div>
      </div>
    </section>

    <div class="romance-name" aria-label="Name of girl">
      <span class="name-row">
        <span class="name">Mỹ Duyên</span>
        <img class="mini-heart" src="assets/heart-icon.png" alt="" aria-hidden="true" />
      </span>
    </div>

  </main>

  <script>
    const heartLayer = document.getElementById("heartLayer");
    const heartCluster = document.getElementById("heartCluster");
    const flameCounter = document.getElementById("flameCounter");
    const colors = ["#ff5fa2", "#ff86bc", "#ff4d85", "#ffd1e3", "#ff2d6f"];
    const heartIconSrc = "assets/heart-icon.png";
    const isCompactLayout = window.matchMedia("(max-width: 700px)").matches;
    const clusterPoints = isCompactLayout ? 180 : 320;
    const burstSize = isCompactLayout ? 3 : 5;
    const burstInterval = isCompactLayout ? 680 : 240;
    const maxFloatingHearts = isCompactLayout ? 90 : 160;
    const clusterBurstCycleMs = 11000;
    const clusterBurstDurationMs = 3200;

    function getDaysSinceStart() {
      const startDate = new Date(2024, 7, 17); // August 17, 2024 (month is 0-indexed)
      const today = new Date();
      const startUtc = Date.UTC(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
      const todayUtc = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
      return Math.floor((todayUtc - startUtc) / (1000 * 60 * 60 * 24));
    }

    function updateFlameCounter() {
      if (flameCounter) {
        flameCounter.textContent = getDaysSinceStart();
      }
    }

    function createCluster() {
      const fragment = document.createDocumentFragment();
      const points = clusterPoints;
      const scale = 11.6;
      const heartShape = (t) => {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        return { x, y };
      };

      for (let i = 0; i < points; i += 1) {
        const t = (Math.PI * 2 * i) / points;
        const { x: rawX, y: rawY } = heartShape(t);
        const fill = Math.pow(Math.random(), 0.42);
        const wobble = 1 + (Math.random() * 0.14 - 0.07);
        const x = rawX * scale * fill * wobble;
        const y = -rawY * scale * fill * wobble;
        const depth = Math.sin(t * 3) * 62 + (Math.random() * 20 - 10);
        const size = 10 + Math.random() * 9 + (1 - fill) * 6;
        const particle = document.createElement("span");
        const sprite = document.createElement("img");
        const isFront = Math.cos(t) > 0;
        const flyX = (Math.random() * 18 - 9).toFixed(2) + "px";
        const flyY = (Math.random() * 14 - 7).toFixed(2) + "px";
        const flyZ = (Math.random() * 22 - 11).toFixed(2) + "px";

        particle.className = "heart-particle";
        particle.dataset.layer = isFront ? "front" : "back";
        particle.style.setProperty("--x", `${x}px`);
        particle.style.setProperty("--y", `${y}px`);
        particle.style.setProperty("--z", `${depth.toFixed(2)}px`);
        particle.style.setProperty("--dx", flyX);
        particle.style.setProperty("--dy", flyY);
        particle.style.setProperty("--dz", flyZ);
        particle.style.setProperty("--size", `${size}px`);
        particle.style.setProperty("--scale", (0.84 + (1 - fill) * 0.42 + Math.random() * 0.06).toFixed(2));
        particle.style.setProperty("--beat", `${1.02 + Math.random() * 0.6}s`);
        particle.style.setProperty("--fly", `${3.2 + Math.random() * 3.2}s`);
        particle.style.setProperty("--delay", `${-(Math.random() * 1.8).toFixed(2)}s`);
        const baseOpacity = `${0.62 + Math.random() * 0.18}`;
        particle.dataset.restX = `${x}px`;
        particle.dataset.restY = `${y}px`;
        particle.dataset.restZ = `${depth.toFixed(2)}px`;
        particle.dataset.baseOpacity = baseOpacity;
        particle.style.opacity = baseOpacity;
        sprite.className = "heart-sprite";
        sprite.src = heartIconSrc;
        sprite.alt = "";
        sprite.setAttribute("aria-hidden", "true");
        particle.appendChild(sprite);
        fragment.appendChild(particle);
      }

      heartCluster.prepend(fragment);
    }

    function createHeartOutline() {
      if (!heartCluster) {
        return;
      }

      const outline = document.createElement("div");
      outline.className = "heart-outline";
      outline.setAttribute("aria-hidden", "true");
      heartCluster.appendChild(outline);
      window.setTimeout(() => outline.remove(), 2600);
    }

    function createHeart() {
      const heart = document.createElement("img");
      const size = 10 + Math.random() * 26;
      const x = Math.random() * 100;
      const duration = 9 + Math.random() * 8;
      const delay = -(Math.random() * duration);
      const drift = (Math.random() * 40 - 20).toFixed(2) + "vw";
      const shadow = `rgba(255, 77, 133, ${0.18 + Math.random() * 0.28})`;

      heart.className = "heart";
      heart.src = heartIconSrc;
      heart.alt = "";
      heart.setAttribute("aria-hidden", "true");
      heart.style.setProperty("--size", size + "px");
      heart.style.setProperty("--x", x + "vw");
      heart.style.setProperty("--dur", duration + "s");
      heart.style.setProperty("--delay", delay + "s");
      heart.style.setProperty("--drift", drift);
      heart.style.setProperty("--shadow", shadow);
      heart.style.animationDelay = `${delay}s, ${delay + 0.1}s`;

      heartLayer.appendChild(heart);
      if (heartLayer.childElementCount > maxFloatingHearts) {
        heartLayer.firstElementChild?.remove();
      }
      heart.addEventListener("animationend", () => heart.remove());
    }

    function burstHearts(count) {
      for (let i = 0; i < count; i += 1) {
        createHeart();
      }
    }

    function burstAndRebuildCluster() {
      if (!heartCluster) {
        return;
      }

      const particles = Array.from(heartCluster.querySelectorAll(".heart-particle"));
      if (!particles.length) {
        createCluster();
        return;
      }

      heartCluster.classList.add("is-bursting");
      particles.forEach((particle, index) => {
        const angle = (Math.PI * 2 * index) / particles.length;
        const burstRadius = 240 + Math.random() * 320;
        const burstX = Math.cos(angle) * burstRadius;
        const burstY = Math.sin(angle) * burstRadius * 0.8;
        const burstZ = (Math.random() - 0.5) * 360;
        const scale = 0.22 + Math.random() * 0.38;
        const restX = particle.dataset.restX || particle.style.getPropertyValue("--x");
        const restY = particle.dataset.restY || particle.style.getPropertyValue("--y");
        const restZ = particle.dataset.restZ || particle.style.getPropertyValue("--z");
        const baseOpacity = particle.dataset.baseOpacity || particle.style.opacity;

        particle.style.transition = "transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.7s ease";
        particle.style.opacity = "0.8";
        particle.style.transform = `translate3d(${restX}, ${restY}, ${restZ}) scale(0.72) rotate(${(Math.random() - 0.5) * 18}deg)`;

        window.setTimeout(() => {
          particle.style.transition = "transform 2.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.8s ease";
          particle.style.opacity = "0.14";
          particle.style.transform = `translate3d(${burstX}px, ${burstY}px, ${burstZ}px) scale(${scale}) rotate(${(Math.random() - 0.5) * 60}deg)`;
        }, 220);

        window.setTimeout(() => {
          particle.style.transition = "transform 2.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.8s ease";
          particle.style.opacity = baseOpacity;
          particle.style.transform = `translate3d(${restX}, ${restY}, ${restZ}) scale(1) rotate(0deg)`;
        }, 1380);
      });

      window.setTimeout(() => {
        heartCluster.classList.remove("is-bursting");
      }, clusterBurstDurationMs);
    }

    updateFlameCounter();
    createCluster();
    burstHearts(isCompactLayout ? 24 : 36);
    setInterval(() => burstHearts(burstSize), burstInterval);
    setInterval(() => burstAndRebuildCluster(), clusterBurstCycleMs);
  </script>
</body>
</html>
